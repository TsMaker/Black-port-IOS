name: Build iOS App

on:
  push:
    branches: [ "main", "Principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
    - name: Copiar código do repositório
      uses: actions/checkout@v4

    - name: Configurar CMake
      run: |
        mkdir build-ios
        cd build-ios
        cmake -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -G "Xcode" ..

    - name: Compilar projeto no Xcode
      run: |
        cd build-ios
        xcodebuild -sdk iphoneos -configuration Release build

    - name: Salvar Artefato do Jogo (IPA/App)
      uses: actions/upload-artifact@v4
      with:
        name: Black-iOS-Build
        path: build-ios/Release-iphoneos/
