  scan-android:
    name: Mapear codigo Android
    instance_type: mac_mini_m2
    max_build_duration: 10
    scripts:
      - name: Procurar dependencias de Android
        script: |
          PAT='jni\.h|JNIEnv|android/|__ANDROID__|ANativeWindow|SDL_AndroidGetJNIEnv|SDL_GetAndroid|/storage/|Android/data'
          echo "=== ARQUIVOS COM CODIGO ANDROID ==="
          grep -rlE "$PAT" native src || true
          echo
          echo "=== ARQUIVOS COM VULKAN ==="
          grep -rlE "vulkan/vulkan|VK_USE_PLATFORM|SDL_Vulkan_" native src || true
          echo
          echo "=== DETALHE (primeiras 120 linhas) ==="
          grep -rnE "$PAT" native src | head -n 120 || true
