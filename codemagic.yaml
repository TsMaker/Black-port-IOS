workflows:
  iOS-build:
    name: Build iOS App
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Instalar dependências e preparar ambiente
        script: |
          brew install cmake ninja git-lfs python3
          git lfs install
          git lfs pull
      - name: Gerar código e Compilar
        script: |
          # Garante que o diretório de saída existe
          mkdir -p generated/game
          
          # Deteta automaticamente a ISO na pasta iso/ sem falhar por causa de maiúsculas/minúsculas
          ISO_FILE=$(find iso -iname "*.iso" | head -n 1)
          
          if [ -n "$ISO_FILE" ]; then
            echo "ISO encontrada: $ISO_FILE"
            python3 tools/xdvdfs.py "$ISO_FILE" game generated/game
          else
            echo "Erro: Nenhuma ISO encontrada na pasta iso/"
            exit 1
          fi

          # Configura e compila o projeto para iOS
          mkdir -p build-ios
          cd build-ios
          cmake .. -G Xcode -DCMAKE_SYSTEM_NAME=iOS
          xcodebuild -sdk iphoneos -configuration Release build
    artifacts:
      - build-ios/**/*.app
      - build-ios/**/*.ipa
