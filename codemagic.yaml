workflows:
  iOS-build:
    name: Build iOS App
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Instalar dependências e preparar ambiente
        script: |
          brew install cmake ninja git-lfs python3
          git lfs install
          git lfs pull
      - name: Gerar código e Compilar
        script: |
          mkdir -p generated/game
          
          ISO_FILE=$(find iso ISO -iname "*.iso" 2>/dev/null | head -n 1)
          
          if [ -n "$ISO_FILE" ]; then
            echo "ISO encontrada: $ISO_FILE"
            # Passa os 3 argumentos exigidos pelo xdvdfs.py: ISO, alvo (game) e destino (generated/game)
            python3 tools/xdvdfs.py "$ISO_FILE" game generated/game
          else
            echo "Erro: Nenhuma ISO encontrada."
            exit 1
          fi

          mkdir -p build-ios
          cd build-ios
          cmake .. -G Xcode -DCMAKE_SYSTEM_NAME=iOS
          xcodebuild -sdk iphoneos -configuration Release build
    artifacts:
      - build-ios/**/*.app
      - build-ios/**/*.ipa
