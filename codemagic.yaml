workflows:
  iOS-build:
    name: Build iOS App
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Instalar dependências e preparar ambiente
        script: |
          brew install cmake ninja git-lfs python3
          git lfs install
          git lfs pull
      - name: Gerar código e Compilar
        script: |
          mkdir -p generated/game assets
          
          ISO_FILE=$(find iso ISO -iname "*.iso" 2>/dev/null | head -n 1)
          
          if [ -n "$ISO_FILE" ]; then
            echo "ISO encontrada: $ISO_FILE"
            # Copia ou cria um link da ISO para a pasta assets se o CMake procurar lá
            cp "$ISO_FILE" assets/Black.iso
            
            # Tenta extrair usando o xdvdfs.py listando os ficheiros ou extraindo o default.xbe
            python3 tools/xdvdfs.py "$ISO_FILE" default.xbe generated/game/default.xbe || true
          else
            echo "Erro: Nenhuma ISO encontrada."
            exit 1
          end

          mkdir -p build-ios
          cd build-ios
          cmake .. -G Xcode -DCMAKE_SYSTEM_NAME=iOS
          xcodebuild -sdk iphoneos -configuration Release build
    artifacts:
      - build-ios/**/*.app
      - build-ios/**/*.ipa
