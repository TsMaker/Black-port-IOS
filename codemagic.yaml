workflows:
  iOS-build:
    name: Build iOS App
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Instalar dependências e preparar ambiente
        script: |
          brew install cmake ninja git-lfs python3
          git lfs install
          git lfs pull
      - name: Gerar código e Compilar
        script: |
          # Como os ativos já estão na pasta assets, criamos o diretório de saída esperado pelo CMake
          mkdir -p generated/game
          
          # Cria a pasta de compilação e executa o CMake para iOS
          mkdir -p build-ios
          cd build-ios
          cmake .. -G Xcode -DCMAKE_SYSTEM_NAME=iOS
          xcodebuild -sdk iphoneos -configuration Release build
    artifacts:
      - build-ios/**/*.app
      - build-ios/**/*.ipa
