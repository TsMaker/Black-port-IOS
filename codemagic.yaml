workflows:
  ios-build:
    name: Build iOS App
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Gerar código e Compilar
        script: |
          cd Black-Android-1.8.1
          # Executa o script python para extrair e gerar o código C++ através do default.xbe na pasta assets
          python3 tools/xdvdfs.py || true
          mkdir -p build-ios
          cd build-ios
          cmake -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -G "Xcode" ..
          xcodebuild -sdk iphoneos -configuration Release build
    artifacts:
      - Black-Android-1.8.1/build-ios/Release-iphoneos/*.app
      - Black-Android-1.8.1/build-ios/**/*.ipa
