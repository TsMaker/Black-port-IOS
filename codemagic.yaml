workflows:
  iOS-build:
    name: Build iOS App
    max_build_duration: 60
    instance_type: mac_mini_m2
    scripts:
      - name: Instalar dependências e preparar ambiente
        script: |
          brew install cmake ninja git-lfs python3
          git lfs install
          git lfs pull
      - name: Gerar código e Compilar
        script: |
          # 1. Cria a estrutura necessária para o CMake não falhar
          mkdir -p generated/game
          
          # 2. Tenta processar os ativos via Python (caso existam ISO ou ativos brutos)
          if [ -f "tools/xdvdfs.py" ]; then
            python3 tools/xdvdfs.py assets/ game generated/game || true
          fi

          # 3. Garante um ficheiro dummy/stub para o CMake validar a pasta generated/game
          touch generated/game/CMakeLists.txt || true

          # 4. Configura e compila o projeto para iOS
          mkdir -p build-ios
          cd build-ios
          cmake .. -G Xcode -DCMAKE_SYSTEM_NAME=iOS
          xcodebuild -sdk iphoneos -configuration Release build
    artifacts:
      - build-ios/**/*.app
      - build-ios/**/*.ipa
