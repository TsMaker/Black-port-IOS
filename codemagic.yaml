workflows:
  black-ios:
    name: Black iOS (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      vars:
        SDL_REF: "release-3.2.x"
    scripts:
      - name: Dependências
        script: |
          brew install cmake ninja git-lfs python3 imagemagick librsvg
          git lfs install
          git lfs pull

      - name: Extrair default.xbe da ISO
        script: |
          mkdir -p assets
          if [ ! -f assets/default.xbe ]; then
            ISO=$(find assets iso -maxdepth 1 -iname "*.iso" 2>/dev/null | head -n 1)
            if [ -z "$ISO" ] && [ -n "$GAME_ISO_URL" ]; then
              mkdir -p iso
              curl -L "$GAME_ISO_URL" -o iso/game.iso
              ISO=iso/game.iso
            fi
            [ -n "$ISO" ] || { echo "Nenhuma ISO encontrada"; exit 1; }
            python3 -I tools/xdvdfs.py "$ISO" default.xbe assets/default.xbe
          fi

      - name: Compilar o recompilador (macOS)
        script: |
          TOOLS="$PWD/out/build/host-tools"
          cmake -S tools -B "$TOOLS" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$TOOLS"
          echo "TOOLS=$TOOLS" >> $CM_ENV
          echo "SDK=$(cat "$TOOLS/sdk_dir.txt")" >> $CM_ENV

      - name: Recompilar xbe para C++
        script: |
          if ! grep -q '^\[symbols\]' config/game.toml; then
            "$TOOLS/xbe_symbols" assets/default.xbe "$SDK/xdk" --out config/game.toml
          fi
          "$TOOLS/xbe_recomp" config/game.toml --xdk "$SDK/xdk"

      - name: Preparar MoltenVK para iOS
        script: |
          git clone --depth 1 https://github.com/KhronosGroup/MoltenVK.git build-moltenvk
          cd build-moltenvk
          ./fetchDependencies --ios
          xcodebuild -project MoltenVKPackaging.xcodeproj \
            -scheme "MoltenVK Package (iOS only)" \
            -configuration Release \
            -destination "generic/platform=iOS" build
          PACKAGE="$PWD/Package/Release"
          MVK=$(find "$PACKAGE" -type d -name MoltenVK.xcframework | head -n 1)
          [ -n "$MVK" ] || { echo "MoltenVK.xcframework não foi gerado em Package/Release"; find "$PWD/Package" -maxdepth 5 -print; exit 1; }
          mkdir -p "$CM_BUILD_DIR/moltenvk-package"
          cp -R "$PACKAGE/." "$CM_BUILD_DIR/moltenvk-package/"
          echo "MOLTENVK_ROOT=$CM_BUILD_DIR/moltenvk-package" >> $CM_ENV

      - name: Gerar ícone BLACK TS MAKER
        script: |
          magick -background none ios/AppIcon.svg -resize 1024x1024 ios/AppIcon.png
          file ios/AppIcon.png

      - name: Compilar aplicativo iOS
        script: |
          git clone --depth 1 --branch "$SDL_REF" https://github.com/libsdl-org/SDL third_party/SDL
          # Resolve the package from disk in this step instead of relying only on
          # cross-step environment propagation.
          MOLTENVK_ROOT="$CM_BUILD_DIR/moltenvk-package"
          MVK_LIBRARY="$MOLTENVK_ROOT/MoltenVK/static/MoltenVK.xcframework/ios-arm64/libMoltenVK.a"
          [ -f "$MOLTENVK_ROOT/MoltenVK/static/MoltenVK.xcframework/Info.plist" ] || { echo "MoltenVK static XCFramework não encontrado"; find "$MOLTENVK_ROOT" -maxdepth 7 -print; exit 1; }
          [ -f "$MVK_LIBRARY" ] || { echo "Biblioteca MoltenVK iOS arm64 não encontrada: $MVK_LIBRARY"; find "$MOLTENVK_ROOT" -maxdepth 8 -print; exit 1; }
          [ -f "$MOLTENVK_ROOT/MoltenVK/include/vulkan/vulkan.h" ] || { echo "Cabeçalhos Vulkan ausentes"; exit 1; }
          echo "Usando pacote MoltenVK em $MOLTENVK_ROOT"
          mkdir -p build-ios && cd build-ios
          cmake .. -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DMOLTENVK_ROOT="$MOLTENVK_ROOT"
          cmake --build . --config Release -- \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO

      - name: Empacotar IPA
        script: |
          cd build-ios
          APP=$(find . -name "*.app" -path "*Release-iphoneos*" | head -n 1)
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -r Black-unsigned.ipa Payload

    artifacts:
      - build-ios/Black-unsigned.ipa

  scan-android:
    name: Mapear codigo Android
    instance_type: mac_mini_m2
    max_build_duration: 10
    scripts:
      - name: Procurar dependencias de Android
        script: |
          PAT='jni\.h|JNIEnv|android/|__ANDROID__|ANativeWindow|SDL_AndroidGetJNIEnv|SDL_GetAndroid|/storage/|Android/data'
          echo "=== ARQUIVOS COM CODIGO ANDROID ==="
          grep -rlE "$PAT" native src || true
          echo
          echo "=== ARQUIVOS COM VULKAN ==="
          grep -rlE "vulkan/vulkan|VK_USE_PLATFORM|SDL_Vulkan_" native src || true
          echo
          echo "=== DETALHE (primeiras 120 linhas) ==="
          grep -rnE "$PAT" native src | head -n 120 || true
